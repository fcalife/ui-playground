<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&display=swap">
<style>
:root {
  --bg: #15171a;
  --card: #1f2226;
  --card-hover: #262a2f;
  --line: #33383e;
  --text: #ece8df;
  --text-dim: #a9adb3;
  --accent: #f5c22b;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh;
  background: var(--bg); color: var(--text);
  font: 500 16px/1.5 "Barlow", system-ui, sans-serif;
}
main { max-width: 760px; margin: 0 auto; padding: 56px 16px; }
h1 { margin: 0 0 6px; font-size: 32px; letter-spacing: .02em; }
.intro { margin: 0 0 40px; color: var(--text-dim); }
h2 { margin: 0 0 12px; font-size: 14px; text-transform: uppercase; letter-spacing: .12em; color: var(--accent); }
section + section { margin-top: 32px; }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.mockup {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px;
  padding: 16px 18px; background: var(--card); border: 1px solid var(--line); border-radius: 6px;
}
.mockup:hover { background: var(--card-hover); }
.mockup div { flex: 1 1 280px; }
.mockup h3 { margin: 0; font-size: 19px; }
.mockup p { margin: 2px 0 0; color: var(--text-dim); font-size: 15px; }
.links { display: flex; gap: 16px; }
a { color: var(--accent); font-weight: 600; text-decoration: none; }
a:hover, a:focus-visible { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <h1>UI Playground</h1>
  <p class="intro">Working UI mockups built from real game art. Each prototype comes with a spec for implementation.</p>

  <!-- One <section> per project folder, one <li> per mockup subfolder -->
  <section>
    <h2>dota++</h2>
    <ul>
      <li class="mockup">
        <div>
          <h3>Gem Slot</h3>
          <p>Level-up gem panel: slot a new gem into an ability in one click. Desktop, 1080p stage.</p>
        </div>
        <span class="links">
          <a href="dotapp/gem-slot/">Open prototype</a>
          <a href="https://docs.google.com/document/d/1ztLLXutzzbGl9a2xtSloRMAqdiO1cumeqRBLaw44ys8/edit?tab=t.0#heading=h.t8boefuxmqze" target="_blank" rel="noopener">Read spec</a>
        </span>
      </li>
    </ul>
  </section>
</main>
</body>
</html>
