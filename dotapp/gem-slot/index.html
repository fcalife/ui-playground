<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dota++ · Gem Slot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap">
<style>
/* ── Tokens: every size, color and timing lives here (this block is the measurements spec).
      Sizes are 1080p pixels: the whole screen is a 1920×1080 stage scaled to fit the window. ── */
:root {
  --panel-w: 440px;
  --dock-top: 120px;           /* anchored from the top; height grows downward with content */
  --header-h: 72px;
  --crest-w: 334px;            /* the merged gem + title piece */
  --crest-slope: 22px;         /* horizontal run of the crest's angled sides */
  --chamfer: 12px;             /* slab's bottom-left corner */
  --rim: 2px;                  /* each piece's edge highlight */
  --brace-overlap: 10px;       /* how far each brace tier tucks under the piece above it */
  --layer-shadow: drop-shadow(0 5px 5px rgba(0,0,0,.7));   /* cast by each piece onto the one behind it */
  --brace-w: 228px;            /* stepped corbel under the slab: two tiers, each with a diagonal cut */
  --brace-tier: 26px;
  --brace-cut: 28px;
  --brace-step: 88px;          /* where the lower tier starts, measured from the brace's left edge */
  --slab-pad: 12px;
  --row-gap: 6px;
  --row-pad: 10px;
  --icon-size: 68px;
  --slot-size: 22px;
  --slot-gap: 1px;
  --linked-indent: 30px;
  --linked-icon: 30px;
  --effect-icon: 18px;
  --socket-size: 58px;         /* the gem's rarity ring */
  --medal-size: 44px;
  --hud-slot: 18px;
  --bench-gem: 42px;

  /* The panel body is one silhouette: tier gradient × cross_texture line art, with a single rim */
  --cross: url(assets/cross_texture_tile.png) 0 0 / 656px 389px repeat;   /* mirrored tile, drawn at half size (art is 2×) */
  /* common = slate, rare = blue, epic = purple (Dota/MMO rarity convention, same as the orb UI) */
  /* Panel color = gem TYPE (hues taken from the gem art); top → bottom gradient */
  --type-power: #d0503f, #6d1c16;
  --type-protection: #9aa1a9, #474d55;
  --type-destruction: #d14a9a, #6a1650;
  --type-mobility: #e0802e, #7a3a0c;
  --type-vitality: #4caf50, #1d5a22;
  --type-fortune: #e3b52c, #6f5207;
  --type-time: #2fb5c9, #0e5765;
  --type-utility: #4a78d8, #1f3477;
  --type-space: #8a5ad8, #3c1f78;

  /* Gem RARITY = light rays behind the panel plus a matching metallic ring around the gem
     (common: neither, rare: silver, epic: gold). The ring is radial bands (light → dark = bevel), open center. */
  --rare-ring: radial-gradient(closest-side, transparent 86%, #f4f7fa 88%, #aeb8c4 93%, #6f7a86 97%, transparent 100%);
  --rare-ring-glow: 0 0 8px rgba(225,238,255,.5);
  --epic-ring: radial-gradient(closest-side, transparent 86%, #fff1a6 88%, #f2c230 93%, #9c6a0a 97%, transparent 100%);
  --epic-ring-glow: 0 0 9px rgba(255,196,50,.5);
  --rare-ray-rgb: 228, 238, 252;     --rare-ray-glow-rgb: 205, 220, 240;
  --epic-ray-rgb: 255, 214, 110;     --epic-ray-glow-rgb: 255, 190, 60;
  --ray-count: 16;             /* read by script */
  --rays-size: 900px;
  --t-rays: 24s;               /* one full turn of the light rays */
  --c-rarity-common: #e2e5e9;
  --c-rarity-rare: #e4ecf6;
  --c-rarity-epic: #ffd45a;

  /* Rows are depressions carved into the slab: translucent dark, so they carry a hint of the tier */
  --well-shadow: inset 0 2px 6px rgba(0,0,0,.85), inset 0 0 0 1px rgba(0,0,0,.55), 0 1px 0 rgba(255,255,255,.14);
  --well: rgba(8,10,13,.62);
  --well-hover: rgba(30,34,40,.55);
  --well-linked: rgba(4,5,7,.72);
  --well-picking: rgba(74,48,6,.75);

  /* Game art skins for the separate pieces (buttons, dice tab), 9-sliced; art is 2× so border = slice / 2 */
  --skin-btn: url(assets/button_base.png);
  --skin-btn-blue: url(assets/button_active_v2.png);
  --skin-btn-gold: url(assets/button_active.png);

  --c-stone-hi: #6a7078;
  --c-text: #ece8df;
  --c-text-dim: #a9adb3;
  --c-highlight: #f5c22b;
  --c-kicker: #e9b53c;
  --c-gold-hi: #f7cf3c;
  --c-ink: #0c0d0f;
  --c-focus: #f5c22b;

  --font-ui: "Barlow", system-ui, sans-serif;
  --fs-title: 24px;
  --fs-rarity: 13px;
  --fs-name: 17px;
  --fs-kicker: 13px;
  --fs-body: 14px;
  --fs-linked: 13px;
  --fs-button: 18px;

  --t-hover: 100ms;
  --t-slide: 160ms;
  --t-slide-out: 120ms;
  --t-fly: 380ms;
  --t-upgrade-hold: 250ms;     /* the original rarity stays on screen this long before the upgrade lands */
  --t-flash: 360ms;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
body { font-family: var(--font-ui); color: var(--c-text); }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; }
button:focus-visible { outline: 2px solid var(--c-focus); outline-offset: 2px; }
img { display: block; }

/* 1920×1080 stage over an in-game screenshot, scaled to fit the window (--fit is set by script) */
.screen {
  position: absolute; left: 50%; top: 50%;
  width: 1920px; height: 1080px;
  transform: translate(-50%, -50%) scale(var(--fit, .5));
  background: url(context-ingame.webp) center / cover;
  overflow: hidden;
}

/* Game-art skin for buttons: 9-sliced on a layer behind the label, so hover/disabled filters never touch the text */
.skin { position: relative; isolation: isolate; --skin: var(--skin-btn); }
.skin::before {
  content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  border: 0 solid transparent;
  border-image: var(--skin) 6 fill / 3px stretch;
  filter: var(--skin-filter, none);
  transition: filter var(--t-hover);
}
.skin:hover { --skin-filter: brightness(1.2); }

/* ── Dock: the panel, flush with the right screen edge. Slides are driven by script. ── */
.dock {
  /* common: no real border, just a lighter edge of the panel's own color */
  --rim-bg: linear-gradient(rgba(255,255,255,.28), rgba(0,0,0,.25)), linear-gradient(var(--fill));
  --rarity-c: var(--c-rarity-common);
  --main-shape: polygon(
    var(--crest-slope) 0, calc(var(--crest-w) - var(--crest-slope)) 0, var(--crest-w) var(--header-h),
    100% var(--header-h), 100% 100%,
    var(--chamfer) 100%, 0 calc(100% - var(--chamfer)), 0 var(--header-h));
  position: absolute; right: 0; top: var(--dock-top);
  width: var(--panel-w);
  isolation: isolate;
}
.dock[data-type="power"]       { --fill: var(--type-power); }
.dock[data-type="protection"]  { --fill: var(--type-protection); }
.dock[data-type="destruction"] { --fill: var(--type-destruction); }
.dock[data-type="mobility"]    { --fill: var(--type-mobility); }
.dock[data-type="vitality"]    { --fill: var(--type-vitality); }
.dock[data-type="fortune"]     { --fill: var(--type-fortune); }
.dock[data-type="time"]        { --fill: var(--type-time); }
.dock[data-type="utility"]     { --fill: var(--type-utility); }
.dock[data-type="space"]       { --fill: var(--type-space); }
.dock[data-tier="2"] { --rarity-c: var(--c-rarity-rare); --ring: var(--rare-ring); --ring-glow: var(--rare-ring-glow); }
.dock[data-tier="3"] { --rarity-c: var(--c-rarity-epic); --ring: var(--epic-ring); --ring-glow: var(--epic-ring-glow); }

/* ── Rarity effect behind the panel (mock-up of the in-engine particles): light rays fanning out and turning
      slowly, silver for rare and gold for epic. Each ray is a wedge whose gradient fades along its length
      (no CSS mask: masks failed to render in the in-app browser). ── */
.dock[data-tier="2"] { --ray-rgb: var(--rare-ray-rgb); --ray-glow-rgb: var(--rare-ray-glow-rgb); }
.dock[data-tier="3"] { --ray-rgb: var(--epic-ray-rgb); --ray-glow-rgb: var(--epic-ray-glow-rgb); }
.aura--rays {
  position: absolute; z-index: -10; pointer-events: none; display: none;
  left: 50%; top: 50%; width: var(--rays-size); height: var(--rays-size); translate: -50% -50%;
  background: radial-gradient(closest-side, rgba(var(--ray-glow-rgb), .5), transparent);
  mix-blend-mode: screen;                      /* light adds to the scene instead of painting over it */
  animation: spin var(--t-rays) linear infinite;
}
.dock:is([data-tier="2"], [data-tier="3"]) .aura--rays { display: block; }
.ray {
  position: absolute; left: 50%; bottom: 50%;
  width: var(--w); height: 50%; margin-left: calc(var(--w) / -2);
  transform-origin: 50% 100%; rotate: var(--a);
  background: linear-gradient(to top, rgba(var(--ray-rgb), 0), rgba(var(--ray-rgb), .8) 35%, rgba(var(--ray-rgb), 0));
  clip-path: polygon(46% 100%, 54% 100%, 100% 0, 0 0);
}
@keyframes spin { to { rotate: 1turn; } }

/* ── Pieces: the main slab (crest + body) and two brace tiers stacked behind it.
      Each piece tucks under the one above and receives its shadow, so they read as layers. ── */
.layer { position: absolute; pointer-events: none; filter: var(--layer-shadow); }
.layer--main, .flash { inset: 0 0 calc(2 * var(--brace-tier)) 0; }
/* the main piece also casts the panel's shadow onto the game, to the left */
.layer--main { z-index: -1; --shape: var(--main-shape); filter: var(--layer-shadow) drop-shadow(-8px 4px 14px rgba(0,0,0,.7)); }
.layer--upper {
  right: 0; bottom: var(--brace-tier); z-index: -3;
  width: var(--brace-w); height: calc(var(--brace-tier) + var(--brace-overlap));
  --shape: polygon(0 0, 100% 0, 100% 100%, var(--brace-cut) 100%);
  --shade: brightness(.92);
}
.layer--lower {
  right: 0; bottom: 0; z-index: -4;
  width: calc(var(--brace-w) - var(--brace-step)); height: calc(var(--brace-tier) + var(--brace-overlap));
  --shape: polygon(0 0, 100% 0, 100% 100%, var(--brace-cut) 100%);
  --shade: brightness(.82);
}
/* rim = the piece's outline; body = the same shape inset by --rim (not on the screen-edge side) */
.shape, .shape::before { position: absolute; clip-path: var(--shape); }
.shape { inset: 0; background: var(--rim-bg); filter: var(--shade, none); }
.shape::before {
  content: ""; inset: var(--rim) 0 var(--rim) var(--rim);
  background: var(--cross), linear-gradient(var(--fill));
  background-blend-mode: multiply, normal;
}
/* white flash over the main piece when a supporter upgrade lands */
.flash { position: absolute; z-index: 3; pointer-events: none; clip-path: var(--main-shape); background: #fff; opacity: 0; }

/* click-through: the dice tab sits behind the crest layer, so the header box itself mustn't catch its clicks */
.header { height: var(--header-h); display: grid; grid-template-columns: var(--crest-w) 1fr; pointer-events: none; }
/* Crest: the gem and its name in one piece */
.crest {
  display: grid; grid-template-columns: var(--socket-size) 1fr; align-items: center; gap: 4px;
  /* the visible header runs down to the first row, so center in that span (header + slab padding) */
  padding: var(--slab-pad) calc(var(--crest-slope) + 4px) 0 calc(var(--crest-slope) + 4px);
}
/* rarity ring around the gem (rare/epic only); empty on common */
.socket {
  width: var(--socket-size); height: var(--socket-size);
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--ring, none);
  box-shadow: var(--ring-glow, none);
}
.medal {
  width: var(--medal-size); height: var(--medal-size);
  border-radius: 50%;
  /* a white rim light and a dark contact shadow lift the gem off any panel color */
  filter: drop-shadow(0 0 3px rgba(255,255,255,.55)) drop-shadow(0 2px 3px rgba(0,0,0,.85));
}
.crest__title { text-align: center; color: #f6f3ec; text-shadow: 0 1px 2px rgba(0,0,0,.9), 0 0 6px rgba(0,0,0,.6); }
.crest__title h1 { margin: 0; font-size: var(--fs-title); white-space: nowrap; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; line-height: 1; }
.crest__title p { margin: 3px 0 0; font-size: var(--fs-rarity); font-style: italic; font-weight: 600; color: var(--rarity-c); }
/* gold dice tab: tucked behind the crest (which overlaps and shades its left end) and into the slab below */
.currency {
  --skin: var(--skin-btn-gold);
  z-index: -2; pointer-events: auto;
  align-self: end; height: calc(70% + 8px);
  margin: 0 0 -8px calc(-1 * var(--crest-slope) - 6px);
  padding: 0 6px 8px calc(var(--crest-slope) + 4px);
  display: flex; align-items: center; justify-content: center; gap: 3px;
  font-size: 13px; font-weight: 700; color: var(--c-ink);
}
.currency img { width: 32px; height: 32px; }
.currency:disabled { --skin-filter: grayscale(.8) brightness(.7); cursor: not-allowed; }

.slab { padding: var(--slab-pad); display: grid; gap: var(--row-gap); }
.brace-space { height: calc(2 * var(--brace-tier)); }   /* room for the brace pieces, which are drawn by .layer--upper/--lower */

/* ── Ability rows: depressions carved into the slab ── */
.options { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--row-gap); }
.option { position: relative; transition: opacity var(--t-hover); }
.well {
  background: var(--well);
  border-radius: 2px;
  box-shadow: var(--well-shadow);
  transition: background-color var(--t-hover);
}
.option:hover .option__main { background: var(--well-hover); }
/* The whole group (row + linked drawer) is one click target; slot buttons sit above it and only take clicks while picking */
.option__hit { position: absolute; inset: 0; z-index: 0; padding: 0; }
.option__hit:focus-visible { outline-offset: -2px; }
.option__main, .linked { position: relative; pointer-events: none; }

.option__main {
  display: grid; grid-template-columns: var(--icon-size) 1fr; gap: 12px; align-items: center;
  padding: var(--row-pad) calc(var(--row-pad) + 2px);
}
.option__icon > img {
  width: var(--icon-size); height: var(--icon-size);
  border: 2px solid var(--c-ink);
  outline: 1px solid var(--c-stone-hi);
}
.slots { display: flex; justify-content: center; gap: var(--slot-gap); margin-top: 4px; }
.slot { position: relative; width: var(--slot-size); height: var(--slot-size); padding: 0; border-radius: 50%; }
.slot img { width: 100%; height: 100%; }
.slot__preview { position: absolute; inset: 0; opacity: 0; }
.slot:disabled { pointer-events: none; cursor: default; }
.slot:not(:disabled) { pointer-events: auto; }

/* Title pinned to the top; effects centered in the space left below it */
.option__text { align-self: stretch; display: flex; flex-direction: column; }
.option__kicker { margin: 0; font-size: var(--fs-kicker); font-style: italic; color: var(--c-kicker); }
.option__name { margin: 0 0 4px; font-size: var(--fs-name); font-weight: 700; text-transform: uppercase; letter-spacing: .03em; line-height: 1.15; }
.effects { flex: 1; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
.effects li { display: grid; grid-template-columns: var(--effect-icon) 1fr; gap: 8px; align-items: start; font-size: var(--fs-body); font-weight: 500; line-height: 1.25; }
.effects img { width: var(--effect-icon); height: var(--effect-icon); }
.effects :is(.plain, .note) { display: block; }
.effects .note { color: var(--c-text-dim); font-style: italic; }
.hl { color: var(--c-highlight); font-weight: 700; }

/* Linked ability: a smaller, deeper drawer hanging under its parent row */
.linked {
  background: var(--well-linked);
  margin: -2px 0 0 var(--linked-indent);
  padding: 7px 12px;
  display: grid; grid-template-columns: 14px var(--linked-icon) 1fr; gap: 8px; align-items: center;
}
.linked[hidden] { display: none; }
.linked__chain { width: 14px; height: 14px; color: var(--c-text-dim); }
.linked__icon { width: var(--linked-icon); height: var(--linked-icon); border: 1px solid var(--c-ink); }
.linked .effects li { font-size: var(--fs-linked); }

/* ── Buttons ── */
.actions { display: flex; gap: 8px; margin-top: 2px; }
.btn { padding: 10px 14px; font-size: var(--fs-button); font-weight: 700; text-shadow: 0 1px 2px rgba(0,0,0,.8); }
/* the game's blue button skin, as-is (closest to the Utility gem's blue panel) */
/* dark neutral stone, close to the Gems Bench's own color: no hue, so it never clashes with a gem type's panel */
.btn--bench { --tone: brightness(.62); --skin-filter: var(--tone); flex: 1; }
.btn--bench:hover { --skin-filter: var(--tone) brightness(1.3); }

/* supporter upgrade notice, shown at the top of the slab while the upgraded gem is on offer */
.bonus {
  margin: 0; padding: 6px 10px;
  text-align: center; font-size: 14px; font-weight: 700; letter-spacing: .02em;
  color: var(--c-rarity-epic);
  background: rgba(8,10,13,.7);
  border: 1px solid rgba(255,212,90,.55); border-radius: 2px;
  text-shadow: 0 1px 2px rgba(0,0,0,.9);
}
.bonus[hidden] { display: none; }

/* LATER sits above the panel, flush right; it stays on screen when the panel rolls out and becomes "◀ GEMS" */
.later {
  position: absolute; right: 0; top: calc(var(--dock-top) - 48px);
  display: flex; align-items: center; gap: 8px;
  padding: 8px 14px;
  font-size: 15px; font-weight: 600; text-transform: uppercase; text-shadow: 0 1px 2px rgba(0,0,0,.8);
}
.later .arrow { width: 0; height: 0; border-left: 9px solid currentColor; border-block: 6px solid transparent; }
.later.is-deferred { flex-direction: row-reverse; }
.later.is-deferred .arrow { rotate: 180deg; }

/* ── States (data-state on .screen) ── */
.screen:is([data-state="rerolling"], [data-state="leaving"], [data-state="deferred"], [data-state="upgrading"]) .dock { pointer-events: none; }
.screen[data-state="picking"] .option:not(.is-picking) { opacity: .55; }
.screen[data-state="picking"] .option:not(.is-picking):hover { opacity: 1; }
.option.is-picking .option__main { background: var(--well-picking); box-shadow: inset 0 2px 6px rgba(0,0,0,.85), inset 0 0 0 1px var(--c-gold-hi); }
.option.is-picking .option__name { color: var(--c-highlight); }
.option.is-picking .slot { outline: 2px solid var(--c-gold-hi); outline-offset: 1px; cursor: pointer; }
/* hover previews the swap: the incoming gem replaces the old one */
.option.is-picking .slot:is(:hover, :focus-visible) .slot__preview { opacity: 1; }
.option.is-picking .slot:is(:hover, :focus-visible) { scale: 1.15; }

/* ── Live gem strips overlaid on the screenshot's ability bar ── */
.hud-slots {
  position: absolute; top: 920px;
  display: flex; gap: 1px; padding: 2px 4px;
  translate: -50% 0;
  background: rgba(14,15,18,.95); border-radius: 12px;
}
.hud-slots img { width: var(--hud-slot); height: var(--hud-slot); }
.hud-slots .is-new { animation: pop 260ms ease-out; }
@keyframes pop { from { scale: 1.8; } }
/* covers the screenshot's "0/15" in the open Gems Bench */
.bench-count { position: absolute; left: 604px; top: 666px; width: 50px; padding-left: 4px; font-size: 14px; line-height: 20px; background: #2a3037; color: #c9ced3; }
/* gems stored in the open Gems Bench's well */
.bench-gems { position: absolute; left: 609px; top: 719px; display: flex; gap: 5px; }
.bench-gems img { width: var(--bench-gem); height: var(--bench-gem); }
.bench-gems .is-new { animation: pop 260ms ease-out; }
/* a gem in flight to the bench */
.ghost { position: absolute; z-index: 5; transform-origin: 0 0; pointer-events: none; filter: drop-shadow(0 0 10px rgba(247,207,60,.6)); }

/* ── Prototype-only controls (not game UI) ── */
.demo {
  position: absolute; left: 24px; top: 150px; width: 320px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px;
  padding: 10px 14px; border: 1px dashed rgba(255,255,255,.45); border-radius: 6px; background: rgba(0,0,0,.65);
  font-size: 14px;
}
.demo__label { flex-basis: 100%; text-transform: uppercase; letter-spacing: .08em; font-size: 12px; color: var(--c-text-dim); }
.demo button { padding: 6px 12px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.35); border-radius: 4px; }
.demo__log { flex-basis: 100%; margin: 0; min-height: 1.3em; }

@media (prefers-reduced-motion: reduce) {
  :root { --t-hover: 0ms; --t-slide: 0ms; --t-slide-out: 0ms; --t-fly: 0ms; --t-upgrade-hold: 0ms; --t-flash: 0ms; }
  :is(.hud-slots, .bench-gems) .is-new { animation: none; }
  .aura--rays { animation: none; }
}
</style>
</head>
<body>

<main class="screen" data-state="choosing">
  <button class="later skin" data-action="later"><span><span data-bind="laterLabel">Later</span> (<span data-bind="pending"></span>)</span><span class="arrow"></span></button>

  <section class="dock" data-tier="1" aria-labelledby="gem-name">
    <div class="aura--rays" aria-hidden="true"></div>
    <div class="layer layer--lower" aria-hidden="true"><i class="shape"></i></div>
    <div class="layer layer--upper" aria-hidden="true"><i class="shape"></i></div>
    <div class="layer layer--main" aria-hidden="true"><i class="shape"></i></div>

    <header class="header">
      <div class="crest">
        <div class="socket"><img class="medal" src="assets/t1_fortune.png" alt=""></div>
        <div class="crest__title">
          <h1 id="gem-name" data-bind="gemName"></h1>
          <p>(<span data-bind="rarity"></span>)</p>
        </div>
      </div>
      <button class="currency skin" data-action="reroll" aria-label="Reroll gem">
        <img src="assets/dice.png" alt=""><span>x<span data-bind="dice"></span></span>
      </button>
    </header>

    <div class="slab">
      <p class="bonus" hidden aria-live="polite">Supporter bonus activated! Gem upgraded.</p>
      <ul class="options"></ul>
      <div class="actions">
        <button class="btn btn--bench skin" data-action="bench">Send gem to bench</button>
      </div>
    </div>

    <div class="brace-space"></div>
    <div class="flash" aria-hidden="true"></div>
  </section>

  <div class="hud"></div>
  <div class="bench-gems"></div>
  <span class="bench-count"><span data-bind="benchCount"></span>/<span data-bind="benchMax"></span></span>

  <aside class="demo">
    <span class="demo__label">Prototype controls</span>
    <label><input type="checkbox" name="supporter" checked> Supporter</label>
    <button data-action="forceUpgrade">Force an upgrade</button>
    <button data-action="replay">Reset demo</button>
    <p class="demo__log" data-bind="log" aria-live="polite"></p>
  </aside>
</main>

<template id="option-tpl">
  <li class="option">
    <button class="option__hit" data-action="slot"></button>
    <div class="option__main well">
      <div class="option__icon"><img alt=""><div class="slots"></div></div>
      <div class="option__text">
        <p class="option__kicker"></p>
        <h2 class="option__name"></h2>
        <ul class="effects"></ul>
      </div>
    </div>
    <div class="linked well" hidden>
      <svg class="linked__chain" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true">
        <path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1.2 1.2"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1.2-1.2"/>
      </svg>
      <img class="linked__icon" alt="">
      <ul class="effects"></ul>
    </div>
  </li>
</template>
<script>
// ── Content: edit this to experiment. ──
// The hero's abilities never change during a match; rerolling swaps the gem, which changes each ability's effects.
const DATA = {
  dice: 99999,
  pending: 1,
  supporterUpgradeChance: 0.25,   // supporters: chance a new common/rare gem arrives upgraded one tier
  benchMax: 15,
  gemTypes: ["destruction", "fortune", "mobility", "power", "protection", "space", "time", "utility", "vitality"],
  // index = tier - 1; gem icons are assets/t{tier}_{type}.png; the tier also tints the panel
  rarities: ["common", "rare", "epic"],
  startGem: { type: "fortune", tier: 1 },
  // maxSlots: grows 1 → 2 → 3 over a match in the real game; fixed here to show a 2-slot ultimate.
  // slots: gems already slotted at demo start (Hex starts full to show the "All slots full" flow)
  // gems: what each gem type does to this ability. One entry per effect line: a string, or { icon, text }.
  //   {a|b|c} = value at tier 1|2|3 (a single {a} applies to every tier); braces render highlighted.
  // linked: an extra ability that inherits this one's gems; its drawer only shows for gem types it lists.
  abilities: [
    { name: "Ether Shock", icon: "assets/ether-shock.png", maxSlots: 3,
      slots: [{ type: "power", tier: 1 }],
      gems: {
        power:       ["Damage {+65|+130|+260}"],
        protection:  ["{+0.8%|+1.59%|+3.12%} magic resistance per stack when this ability damages an enemy, up to {10} stacks, each lasting {10s}"],
        destruction: ["{-10%|-20%|-40%} base attack damage to enemies damaged by this ability for {5s}"],
        utility:     ["Turns enemies damaged by this ability ethereal for {0.3s|0.6s|1.2s}"],
        mobility:    ["{-10|-20|-40} attack speed to enemies damaged by this ability for {5s}"],
        vitality:    [{ icon: "mana", text: "{8%|14.72%|25.11%} mana cost reduction" },
                      { icon: "heal", text: "{-12%|-21.12%|-33.32%} healing received to enemies damaged by this ability for {5s}" }],
        fortune:     ["Targets {+0.5|+1|+2}",
                      "{5%|10%|20%} / {2%|4%|8%} / {0.5%|1%|2%} chance to cast this ability 2 / 3 / 4 times ({5s} cooldown)"],
        time:        ["{8%|14.72%|25.11%} cooldown reduction"],
        space:       ["Start radius {+12|+24|+48}", "End radius {+18|+36|+72}", "End distance {+30|+60|+120}", "{+50|+100|+200} cast range"],
      } },
    { name: "Hex", icon: "assets/hex.png", maxSlots: 3,
      slots: [{ type: "vitality", tier: 2 }, { type: "time", tier: 1 }, { type: "space", tier: 3 }],
      gems: {
        power:       ["{+2|+4|+8} secondary attributes on cast for {8s}"],
        protection:  ["{+1|+2|+4} armor on cast for {5s}"],
        destruction: ["{-1|-2|-4} armor to the unit that receives the watched modifier for {5s}"],
        utility:     ["Duration {+0.08|+0.15|+0.3}"],
        mobility:    ["Marks the unit for {10s}, radiating {-11.25|-22.5|-45} movement speed to enemies within a {650|700|800} radius"],
        vitality:    [{ icon: "mana", text: "{8%|14.72%|25.11%} mana cost reduction" },
                      { icon: "hp", text: "{-25|-50|-100} max health to the unit that receives the watched modifier for {5s}" }],
        fortune:     ["{5%|10%|20%} / {2%|4%|8%} / {0.5%|1%|2%} chance to cast this ability 2 / 3 / 4 times ({5s} cooldown)"],
        time:        ["{8%|14.72%|25.11%} cooldown reduction"],
        space:       ["{+50|+100|+200} cast range"],
      },
      linked: { name: "Fowl Play", icon: "assets/fowl-play.png",
        gems: {
          protection: ["Invulnerable time {+0.05|+0.1|+0.2}", "Invuln duration {+0.01|+0.02|+0.04}"],
          utility:    ["Duration {+0.05|+0.1|+0.2}"],
          mobility:   ["Movespeed bonus {+0.5%|+1%|+2%}"],
          fortune:    ["Total chickens {+0.25|+0.5|+1}"],
          time:       ["{8%|14.72%|25.11%} cooldown reduction"],
        } } },
    { name: "Shackles", icon: "assets/shackles.png", maxSlots: 3,
      slots: [{ type: "destruction", tier: 1 }, { type: "protection", tier: 2 }],
      gems: {
        power:       ["Total damage/heal {+55|+110|+220}", "Scepter shock {+0.5%|+1%|+2%}"],
        protection:  ["{5%|10%|20%} damage delay to the target ally for {8s}", "{5%|10%|20%} damage delay on cast for {8s}"],
        destruction: ["{-0.2|-0.4|-0.8} strength per stack to enemies damaged by this ability, up to {10} stacks, each lasting {10s}"],
        utility:     ["Max duration {+0.2|+0.4|+0.8}", "Ward linger duration {+0.2|+0.4|+0.8}",
                      "Pulls the unit that receives the watched modifier {25|50|100} units closer ({1s} cooldown)"],
        mobility:    ["Scepter shock interval {-0.04|-0.08|-0.16}", "Tick interval {-0|-0.01|-0.01}",
                      "On cast, radiates an aura for {10s}: {+9|+18|+36} attack speed to allies within a {650|700|800} radius",
                      "On cast, radiates an aura for {10s}: {+75|+150|+300} projectile speed to allies within a {650|700|800} radius"],
        vitality:    ["Heal {+10%|+20%|+40%}", { icon: "mana", text: "{8%|14.72%|25.11%} mana cost reduction" }],
        fortune:     ["{+8%|+14.72%|+25.11%} evasion on cast for {5s}"],
        time:        ["{8%|14.72%|25.11%} cooldown reduction"],
        space:       ["Scepter shock radius {+25|+50|+100}"],
      } },
    { name: "Mass Serpent Ward", icon: "assets/mass-serpent-ward.png", maxSlots: 2,
      slots: [],
      gems: {
        power:       ["Bonus damage {+8|+16|+32}"],
        protection:  ["Grants a {60|120|240} HP shield against magical damage on cast for {45s}"],
        destruction: ["Creates an aura on the ground for {12s}, radiating {-5|-10|-20} attack damage to enemies within a {650|700|800} radius"],
        utility:     ["Duration {+1.5|+3|+6}"],
        mobility:    ["{+10|+20|+40} movement speed to nearby allies for {5s}"],
        vitality:    ["Ward health {+0.25|+0.5|+1}", "Hits to destroy {+0.25|+0.5|+1}", { icon: "mana", text: "{7%|13.02%|22.65%} mana cost reduction" }],
        fortune:     ["Ward count {+0.25|+0.5|+1}", "Attacks have a {2%|4%|8%} chance to steal {3|6|12} gold"],
        time:        ["{7%|13.02%|22.65%} cooldown reduction"],
        space:       ["Bonus attack range {+10|+20|+40}", "Mega ward model scale multiplier {+0.03|+0.05|+0.1}",
                      "Spawn radius {+5|+10|+20}", "{+50|+100|+200} cast range"],
      } },
  ],
};

// Effect-line icons (placeholders cropped from the concept; the real set is still to be made)
const EFFECT_ICONS = {
  mana: "assets/effect-mana.png",
  heal: "assets/effect-heal.png",
  hp:   "assets/effect-hp.png",
};

// x centers of Q / W / E / R in context-ingame.webp, in ability order (Fowl Play has no slots)
const HUD_SLOT_X = [860, 917, 975, 1092];
// first gem position in the open Gems Bench's well, and the distance between stored gems
const BENCH = { x: 609, y: 719, step: 47 };

const screen = document.querySelector(".screen");
const dock = screen.querySelector(".dock");
const list = screen.querySelector(".options");
const tpl = document.getElementById("option-tpl");
let state;

const ms = name => parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name)) || 0;
const wait = t => new Promise(r => setTimeout(r, t));
const escape = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
// {a|b|c} → the value for this tier, highlighted
const rich = (s, tier) => escape(s).replace(/\{(.+?)\}/g, (_, v) => {
  const byTier = v.split("|");
  return `<span class="hl">${byTier[Math.min(tier, byTier.length) - 1]}</span>`;
});
const gemIcon = g => `assets/t${g.tier}_${g.type}.png`;
const gemName = g => `${g.type[0].toUpperCase()}${g.type.slice(1)} Gem`;
const randomGem = () => ({
  type: state.gemTypes[Math.floor(Math.random() * state.gemTypes.length)],
  tier: 1 + Math.floor(Math.random() * state.rarities.length),
});

function bind(key, value) {
  document.querySelectorAll(`[data-bind="${key}"]`).forEach(el => el.textContent = value);
}

function effectsHtml(lines) {
  return lines.map(line => {
    const { icon, text } = typeof line === "string" ? { text: line } : line;
    return icon
      ? `<li><img src="${EFFECT_ICONS[icon]}" alt=""><span>${rich(text, state.gem.tier)}</span></li>`
      : `<li class="plain">${rich(text, state.gem.tier)}</li>`;
  }).join("");
}

function renderRow(ability, i) {
  const li = tpl.content.firstElementChild.cloneNode(true);
  const picking = state.picking === i;
  const incoming = escape(gemName(state.gem));
  li.classList.toggle("is-picking", picking);

  const hit = li.querySelector(".option__hit");
  hit.dataset.index = i;
  hit.setAttribute("aria-label", picking ? `Cancel replacing a gem in ${ability.name}` : `Slot ${gemName(state.gem)} into ${ability.name}`);
  li.querySelector(".option__icon img").src = ability.icon;

  li.querySelector(".slots").innerHTML = Array.from({ length: ability.maxSlots }, (_, s) => {
    const g = ability.slots[s];
    if (!g) return `<span class="slot"><img src="assets/gem_slot.png" alt=""></span>`;
    return `<button class="slot" data-action="replace" data-index="${i}" data-slot="${s}" ${picking ? "" : "disabled"}
              aria-label="Replace ${escape(gemName(g))} with ${incoming}">
              <img src="${gemIcon(g)}" alt=""><img class="slot__preview" src="${gemIcon(state.gem)}" alt="">
            </button>`;
  }).join("");

  const kicker = li.querySelector(".option__kicker");
  const name = li.querySelector(".option__name");
  const effects = li.querySelector(".option__text .effects");
  if (picking) {
    kicker.hidden = true;
    name.textContent = "All slots full";
    effects.innerHTML = `<li class="note">Click a gem to bench it and slot this one in its place.</li>`;
  } else {
    kicker.textContent = "Slot gem into";
    name.textContent = ability.name;
    const lines = ability.gems[state.gem.type];
    effects.innerHTML = lines ? effectsHtml(lines) : `<li class="note">Effects not defined yet for this gem.</li>`;
  }

  const linkedLines = ability.linked?.gems[state.gem.type];
  if (linkedLines) {
    const linked = li.querySelector(".linked");
    linked.hidden = false;
    const icon = linked.querySelector(".linked__icon");
    icon.src = ability.linked.icon;
    icon.alt = ability.linked.name;
    icon.title = `${ability.linked.name} (gets gems from ${ability.name})`;
    linked.querySelector(".effects").innerHTML = effectsHtml(linkedLines);
  }
  return li;
}

function renderHud() {
  screen.querySelector(".hud").innerHTML = state.abilities.map((ability, i) => {
    const slots = Array.from({ length: ability.maxSlots }, (_, s) => {
      const g = ability.slots[s];
      const isNew = state.lastSlot?.index === i && state.lastSlot?.slot === s;
      return `<img src="${g ? gemIcon(g) : "assets/gem_slot.png"}" alt="" ${isNew ? 'class="is-new"' : ""}>`;
    }).join("");
    return `<div class="hud-slots" style="left:${HUD_SLOT_X[i]}px">${slots}</div>`;
  }).join("");
}

// The bench shows only gems that have landed; one still in flight appears when it arrives.
function renderBench(newIndex = -1) {
  screen.querySelector(".bench-gems").innerHTML = state.bench.slice(0, state.benchMax)
    .map((g, i) => `<img src="${gemIcon(g)}" alt="${escape(gemName(g))}" ${i === newIndex ? 'class="is-new"' : ""}>`).join("");
  bind("benchCount", state.bench.length);
  bind("benchMax", state.benchMax);
}

function render() {
  bind("gemName", gemName(state.gem));
  bind("rarity", state.rarities[state.gem.tier - 1]);
  bind("dice", state.dice);
  bind("pending", state.pending);
  bind("log", state.log);
  const deferred = screen.dataset.state === "deferred";
  bind("laterLabel", deferred ? "Gems" : "Later");
  screen.querySelector(".later").classList.toggle("is-deferred", deferred);
  dock.dataset.tier = state.gem.tier;
  dock.dataset.type = state.gem.type;
  screen.querySelector(".bonus").hidden = !state.bonus;
  screen.querySelector(".medal").src = gemIcon(state.gem);
  screen.querySelector("[data-action=reroll]").disabled = state.dice <= 0;
  list.replaceChildren(...state.abilities.map(renderRow));
}

function setState(next) {
  screen.dataset.state = next;
  render();
}

function slideIn() {
  dock.getAnimations().forEach(a => a.cancel());
  dock.animate([{ translate: "100% 0" }, { translate: "0 0" }], { duration: ms("--t-slide"), easing: "cubic-bezier(.2,.8,.2,1)" });
}

// Roll the panel out to the right and keep it there until slideIn().
// Timers, not animation.finished: that only resolves on a rendered frame, which background tabs don't produce.
function slideOut(nextState) {
  setState(nextState);
  dock.animate([{ translate: "0 0" }, { translate: "100% 0" }],
               { duration: ms("--t-slide-out"), easing: "cubic-bezier(.6,0,.9,.4)", fill: "forwards" });
  return wait(ms("--t-slide-out"));
}

// A gem flies from an on-screen element into the next free spot of the open Gems Bench.
function flyToBench(fromEl, gem) {
  const index = state.bench.length;
  const sr = screen.getBoundingClientRect(), k = sr.width / 1920;   // client px → stage px
  const a = fromEl.getBoundingClientRect();
  const from = { x: (a.left - sr.left) / k, y: (a.top - sr.top) / k, size: a.width / k };
  const to = { x: BENCH.x + index * BENCH.step, y: BENCH.y, size: ms("--bench-gem") };
  const ghost = new Image();
  ghost.src = gemIcon(gem);
  ghost.className = "ghost";
  Object.assign(ghost.style, { left: `${from.x}px`, top: `${from.y}px`, width: `${from.size}px`, height: `${from.size}px` });
  screen.append(ghost);
  ghost.animate([{ translate: "0 0", scale: 1 },
                 { translate: `${to.x - from.x}px ${to.y - from.y}px`, scale: to.size / from.size }],
                { duration: ms("--t-fly"), easing: "cubic-bezier(.5,0,.3,1)", fill: "forwards" });
  state.bench.push(gem);
  wait(ms("--t-fly")).then(() => { ghost.remove(); renderBench(index); });
}

// Resolve the decision: the HUD updates at once, the panel slides out, and the next gem's panel slides straight back in.
async function closePanel(log, lastSlot = null) {
  state.picking = null;
  state.log = log;
  state.lastSlot = lastSlot;
  renderHud();
  await slideOut("leaving");
  arrive(randomGem());
}

// A new gem slides in. For supporters, a common or rare gem may arrive upgraded: the panel shows the
// original rarity, then flashes and switches to the next tier with the bonus notice. Epics can't upgrade.
async function arrive(gem, forceUpgrade = false) {
  state.gem = gem;
  state.bonus = false;
  const upgradable = gem.tier < state.rarities.length;
  const upgrade = upgradable && (forceUpgrade || (state.supporter && Math.random() < state.supporterUpgradeChance));
  setState(upgrade ? "upgrading" : "choosing");
  slideIn();
  if (!upgrade) return;
  await wait(ms("--t-slide") + ms("--t-upgrade-hold"));
  screen.querySelector(".flash").animate([{ opacity: 0 }, { opacity: .85, offset: .3 }, { opacity: 0 }], { duration: ms("--t-flash") });
  await wait(ms("--t-flash") * .3);           // swap at the flash's peak, while the panel is washed out
  const from = state.rarities[gem.tier - 1];
  state.gem = { ...gem, tier: gem.tier + 1 };
  state.bonus = true;
  state.log = `${state.log} Supporter bonus: ${gemName(gem)} ${from} → ${state.rarities[gem.tier]}.`.trim();
  setState("choosing");
  screen.querySelector(".medal").animate([{ scale: 1.6 }, { scale: 1 }], { duration: 320, easing: "cubic-bezier(.2,.8,.2,1)" });
}

const actions = {
  slot(hit) {
    const i = Number(hit.dataset.index);
    const ability = state.abilities[i];
    if (state.picking === i) {               // clicking the picking row again cancels
      state.picking = null;
      return setState("choosing");
    }
    if (ability.slots.length < ability.maxSlots) {
      ability.slots.push(state.gem);
      return closePanel(`${gemName(state.gem)} → ${ability.name}, slot ${ability.slots.length}.`,
                        { index: i, slot: ability.slots.length - 1 });
    }
    state.picking = i;
    setState("picking");
    list.querySelector(".is-picking .slot")?.focus();
  },
  replace(btn) {
    const i = Number(btn.dataset.index), s = Number(btn.dataset.slot);
    const ability = state.abilities[i];
    const old = ability.slots[s];
    ability.slots[s] = state.gem;
    flyToBench(btn, old);
    closePanel(`${gemName(state.gem)} → ${ability.name}, slot ${s + 1}. ${gemName(old)} sent to the bench.`, { index: i, slot: s });
  },
  bench() {
    flyToBench(screen.querySelector(".medal"), state.gem);
    closePanel(`${gemName(state.gem)} sent to the bench.`);
  },
  // Reroll pops the panel out and back in with the new gem
  async reroll() {
    state.dice--;
    state.picking = null;
    await slideOut("rerolling");
    let next;
    do next = randomGem(); while (next.type === state.gem.type && next.tier === state.gem.tier);
    state.gem = next;
    state.bonus = false;                      // a reroll is not a newly gained gem, so no supporter roll
    setState("choosing");
    slideIn();
  },
  // Prototype control: bring in a new common/rare gem with the supporter upgrade guaranteed
  async forceUpgrade() {
    if (screen.dataset.state !== "deferred") await slideOut("leaving");
    let gem;
    do gem = randomGem(); while (gem.tier >= state.rarities.length);
    arrive(gem, true);
  },
  // LATER rolls the panel out and turns into "◀ GEMS"; clicking that brings the same gem back
  later() {
    if (screen.dataset.state === "deferred") {
      setState("choosing");
      slideIn();
    } else {
      state.picking = null;
      slideOut("deferred");
    }
  },
  replay() { reset(); },
};

function reset() {
  state = structuredClone(DATA);
  Object.assign(state, { gem: state.startGem, bench: [], picking: null, lastSlot: null, log: "", bonus: false,
                         supporter: screen.querySelector("[name=supporter]").checked });
  setState("choosing");
  renderHud();
  renderBench();
  slideIn();
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (!el || el.disabled) return;
  const s = screen.dataset.state, a = el.dataset.action;
  const busy = ["leaving", "rerolling", "upgrading"].includes(s) && a !== "replay";
  const away = s === "deferred" && !["later", "replay", "forceUpgrade"].includes(a);
  if (!busy && !away) actions[a](el);
});
screen.querySelector("[name=supporter]").addEventListener("change", e => state.supporter = e.target.checked);
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && state.picking !== null) {
    state.picking = null;
    setState("choosing");
  }
});

// Rare/epic light rays: evenly spaced wedges with slightly varied widths
const rayCount = ms("--ray-count");
screen.querySelector(".aura--rays").innerHTML = Array.from({ length: rayCount }, (_, i) =>
  `<i class="ray" style="--a:${(360 / rayCount) * i + Math.random() * 8}deg;--w:${50 + Math.random() * 60}px"></i>`).join("");

const fit = () => document.documentElement.style.setProperty("--fit", Math.min(innerWidth / 1920, innerHeight / 1080));
addEventListener("resize", fit);
fit();
reset();
</script>
</body>
</html>
